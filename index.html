<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartel Code — портативний агент для коду</title>
<meta name="description" content="Cartel Code — десктопний застосунок з власним шлюзом API, пулом ключів, 168 плагінами і повністю українською оболонкою." />
<meta name="color-scheme" content="dark" />
<meta property="og:title" content="Cartel Code — портативний агент для коду" />
<meta property="og:description" content="Пише, читає й править код разом з вами. Node і Electron уже всередині: розпакували — працює." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23140f0c'/%3E%3Cg fill='none' stroke='%23ff7a3d' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='7,7 12,12 7,17'/%3E%3Cline x1='13.5' y1='17' x2='18' y2='17'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --background:oklch(16% .008 60);
  --foreground:oklch(95% .01 80);
  --card:oklch(20% .009 60);
  --muted:oklch(24% .011 60);
  --muted-foreground:oklch(68% .015 70);
  --border:oklch(32% .012 60);
  --accent:oklch(26% .02 55);
  --ember:oklch(70% .19 45);
  --ember-soft:oklch(82% .14 65);
  --destructive:oklch(62% .22 25);
  --gradient-ember:linear-gradient(135deg,var(--ember-soft),var(--ember));
  --glow-ember:0 0 0 1px color-mix(in oklab,var(--ember) 35%,transparent),0 20px 60px -20px color-mix(in oklab,var(--ember) 55%,transparent);
  --radius:.75rem;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --wrap:1120px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none !important;transition:none !important}}
body{
  margin:0;background:var(--background);color:var(--foreground);
  font-family:var(--font-sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
  background:color-mix(in oklab,var(--background) 82%,transparent);
  border-bottom:1px solid color-mix(in oklab,var(--border) 60%,transparent)}
.nav{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:700}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--gradient-ember);display:grid;place-items:center;flex:none}
.brand .mark svg{width:17px;height:17px}
.brand .t1{color:var(--foreground)}
.brand .t2{color:var(--ember)}
.nav nav{display:flex;gap:6px;margin-left:14px}
.nav nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted-foreground);font-size:14.5px}
.nav nav a:hover{color:var(--foreground);background:var(--muted)}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted-foreground);font:600 12.5px/1 var(--font-sans);
  padding:7px 11px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--ember);color:oklch(18% .02 55)}
.ghlink{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--border);
  border-radius:9px;text-decoration:none;font-size:14px;color:var(--foreground)}
.ghlink:hover{border-color:color-mix(in oklab,var(--ember) 50%,var(--border))}
.ghlink svg{width:16px;height:16px;fill:currentColor}
@media (max-width:860px){.nav nav{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;padding:88px 0 56px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% 20% auto 20%;height:420px;
  background:radial-gradient(closest-side,color-mix(in oklab,var(--ember) 18%,transparent),transparent);
  filter:blur(30px);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:6px 13px;border-radius:999px;
  border:1px solid color-mix(in oklab,var(--ember) 32%,transparent);
  background:color-mix(in oklab,var(--ember) 10%,transparent);
  color:var(--ember-soft);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ember)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:48px;align-items:center}
.hero-copy{min-width:0}
/* one column below the point where a 2-up hero starts squeezing the headline */
@media (max-width:1000px){.hero-grid{grid-template-columns:1fr;gap:36px}}
.hero h1{font-size:clamp(32px,4.6vw,54px);line-height:1.07;margin:22px 0 0;max-width:14ch}
.hero h1 .em{background:var(--gradient-ember);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero .lead{color:var(--muted-foreground);font-size:clamp(15.5px,1.6vw,18px);max-width:62ch;margin-top:20px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:11px;
  font:600 15px/1 var(--font-sans);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--gradient-ember);color:oklch(18% .02 55);box-shadow:var(--glow-ember)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{border-color:var(--border);color:var(--foreground);background:transparent}
.btn-ghost:hover{background:var(--muted);border-color:color-mix(in oklab,var(--ember) 40%,var(--border))}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.note{margin-top:18px;font-size:13.5px;color:var(--muted-foreground)}

/* ---------- terminal ---------- */
.term{min-width:0;border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);
  background:oklch(13% .008 60);overflow:hidden;box-shadow:0 30px 80px -40px #000}
.term .bar{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--border);
  background:color-mix(in oklab,var(--card) 70%,transparent)}
.term .bar i{width:11px;height:11px;border-radius:50%;background:var(--border);display:block}
.term .bar i:first-child{background:oklch(62% .18 25)}
.term .bar i:nth-child(2){background:oklch(78% .15 85)}
.term .bar i:nth-child(3){background:oklch(72% .16 145)}
.term .bar span{margin-left:8px;font:500 12.5px/1 var(--font-mono);color:var(--muted-foreground)}
.term pre{margin:0;padding:20px 18px;font:14px/1.85 var(--font-mono);overflow-x:auto}
.term .p{color:var(--ember)}
.term .arrow{color:var(--muted-foreground)}
.term .ok{color:oklch(76% .15 150)}
.term .cur{display:inline-block;width:8px;height:16px;background:var(--ember);vertical-align:-3px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);overflow:hidden;margin-top:26px}
.stat{background:var(--background);padding:22px 18px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:clamp(24px,3.4vw,34px);color:var(--ember)}
.stat span{display:block;margin-top:4px;font-size:13px;color:var(--muted-foreground)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats{margin-top:44px}

/* ---------- sections ---------- */
section{padding:76px 0}
.sec-head{margin-bottom:38px}
.sec-kicker{font:600 12px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
.sec-head h2{font-size:clamp(25px,3.6vw,38px);margin-top:14px}
.sec-head p{color:var(--muted-foreground);margin-top:12px;max-width:64ch}

/* builds */
.builds{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.builds{grid-template-columns:1fr}}
.build{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);
  padding:20px 22px;display:flex;align-items:center;gap:16px;transition:.15s;min-height:96px}
.build.is-yours{border-color:color-mix(in oklab,var(--ember) 55%,var(--border));box-shadow:var(--glow-ember)}
.build .os{width:44px;height:44px;border-radius:12px;background:var(--muted);display:grid;place-items:center;flex:none}
.build .os svg{width:22px;height:22px;fill:var(--foreground)}
.build .meta{flex:1;min-width:0}
.build .meta .row1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.build .meta .nm{font-family:var(--font-display);font-size:17px;font-weight:700}
.build .meta .sub{display:block;font:12.5px/1.5 var(--font-mono);color:var(--muted-foreground);margin-top:5px;word-break:break-word}
.build .meta .yours{flex:none;padding:3px 9px;border-radius:999px;font:600 10px/1.5 var(--font-sans);
  text-transform:uppercase;letter-spacing:.06em;background:color-mix(in oklab,var(--ember) 20%,transparent);
  color:var(--ember-soft);border:1px solid color-mix(in oklab,var(--ember) 32%,transparent)}
.dlwrap{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.dl{padding:10px 17px;border-radius:10px;font:600 14px/1 var(--font-sans);text-decoration:none;white-space:nowrap}
.dl-on{background:var(--gradient-ember);color:oklch(18% .02 55)}
.dl-off{border:1px solid var(--border);color:var(--muted-foreground)}
.shield{margin-top:16px;display:flex;gap:11px;align-items:flex-start;padding:15px 17px;border-radius:var(--radius);
  border:1px solid var(--border);background:color-mix(in oklab,var(--card) 60%,transparent);
  font-size:13.5px;color:var(--muted-foreground)}
.joins{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.join{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;text-decoration:none;
  font:600 13px/1 var(--font-sans);border:1px solid color-mix(in oklab,var(--ember) 40%,var(--border));
  color:var(--ember-soft);background:color-mix(in oklab,var(--ember) 8%,transparent)}
.join:hover{background:color-mix(in oklab,var(--ember) 16%,transparent)}
.shield svg{width:17px;height:17px;flex:none;margin-top:2px;fill:var(--ember)}

/* features */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.feats{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.feats{grid-template-columns:1fr}}
.feat{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:24px;transition:.15s}
.feat:hover{border-color:color-mix(in oklab,var(--ember) 45%,var(--border));transform:translateY(-2px)}
.feat .ic{width:40px;height:40px;border-radius:11px;background:color-mix(in oklab,var(--ember) 14%,transparent);
  display:grid;place-items:center;margin-bottom:15px}
.feat .ic svg{width:20px;height:20px;stroke:var(--ember);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.feat h3{font-size:17.5px;margin-bottom:9px}
.feat p{color:var(--muted-foreground);font-size:14.5px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:24px;position:relative}
.step .n{font:700 30px/1 var(--font-display);color:color-mix(in oklab,var(--ember) 55%,transparent);letter-spacing:-.03em}
.step h3{font-size:17px;margin:12px 0 9px}
.step p{color:var(--muted-foreground);font-size:14.5px}

/* faq */
.faq{display:flex;flex-direction:column;gap:10px}
details{border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);background:var(--card);overflow:hidden}
details[open]{border-color:color-mix(in oklab,var(--ember) 40%,var(--border))}
summary{cursor:pointer;padding:17px 20px;font-family:var(--font-display);font-weight:600;font-size:16px;
  list-style:none;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--ember);font:400 21px/1 var(--font-mono)}
details[open] summary::after{content:"−"}
details p{padding:0 20px 19px;color:var(--muted-foreground);font-size:14.5px}

/* footer */
footer{border-top:1px solid var(--border);padding:44px 0 54px;margin-top:20px}
.foot{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:space-between}
.foot .about{max-width:44ch}
.foot .about p{color:var(--muted-foreground);font-size:14px;margin-top:9px}
.foot .links{display:flex;flex-wrap:wrap;gap:20px}
.foot .links a{color:var(--muted-foreground);font-size:14px;text-decoration:none}
.foot .links a:hover{color:var(--ember)}
.sk{display:inline-block;min-width:70px;height:.85em;border-radius:5px;background:var(--muted);
  animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite;vertical-align:-1px}
@keyframes pulse{50%{opacity:.45}}

/* ---------- motion ----------------------------------------------------------
   The page's identity is a terminal booting, so the motion is a boot sequence:
   the hero types itself out, sections rise as you reach them, numbers count up.
   Everything below has an explicit resting state, because the reduced-motion
   rule at the top of this file kills every animation and transition outright —
   an element left at opacity:0 waiting for an animation would simply never
   appear for those visitors. Hence the .rv override in that media query. */

.js .rv{opacity:0;transform:translateY(18px);
  transition:opacity .62s cubic-bezier(.2,.7,.3,1),transform .62s cubic-bezier(.2,.7,.3,1);
  transition-delay:calc(var(--i,0) * 70ms)}
.js .rv.in{opacity:1;transform:none}

/* Hero pieces animate on load rather than on scroll: they are already in view. */
.js .boot{opacity:0;transform:translateY(14px);animation:bootIn .7s cubic-bezier(.2,.7,.3,1) forwards;
  animation-delay:calc(var(--b,0) * 90ms)}
@keyframes bootIn{to{opacity:1;transform:none}}
.js .term.boot{transform:translateY(22px) scale(.985);animation-name:bootTerm}
@keyframes bootTerm{to{opacity:1;transform:none}}

/* The ember behind the headline breathes very slowly — ambient, not decorative. */
.hero::before{animation:drift 19s ease-in-out infinite alternate}
@keyframes drift{
  from{transform:translate3d(-2%,0,0) scale(1);opacity:.9}
  to{transform:translate3d(2%,-3%,0) scale(1.08);opacity:1}
}

/* Terminal typing: each line is revealed character by character by the script,
   and the caret sits at the end of whichever line is currently being written. */
.js .term .ln{visibility:hidden}
.term .ln.on{visibility:visible}
.js .term .cur{opacity:0;transition:opacity .2s}
.term .cur.on{opacity:1}

/* Header gains weight once the hero has scrolled past. */
header{transition:box-shadow .25s,border-color .25s,background .25s}
header.stuck{box-shadow:0 12px 40px -28px #000;
  border-bottom-color:color-mix(in oklab,var(--ember) 22%,var(--border))}

/* Cards lift and catch a little ember light on hover. */
.feat,.power,.new-card{transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s,box-shadow .22s}
.feat:hover,.power:hover,.new-card:hover{
  transform:translateY(-3px);
  border-color:color-mix(in oklab,var(--ember) 45%,var(--border));
  box-shadow:0 22px 50px -34px color-mix(in oklab,var(--ember) 70%,#000)}

.btn{transition:transform .18s cubic-bezier(.2,.7,.3,1),filter .18s,background .18s,border-color .18s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

.stat b{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  .js .rv,.js .boot{opacity:1 !important;transform:none !important}
  .js .term .ln{visibility:visible !important}
  .js .term .cur{opacity:1 !important}
}

/* ---------- what's new ---------- */
.new-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.new-grid{grid-template-columns:1fr}}
.new-card{position:relative;border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);
  background:linear-gradient(180deg,color-mix(in oklab,var(--ember) 5%,var(--card)),var(--card));
  padding:26px 24px 24px}
.new-card .ic{width:40px;height:40px;border-radius:11px;
  background:color-mix(in oklab,var(--ember) 16%,transparent);display:grid;place-items:center;margin-bottom:16px}
.new-card .ic svg{width:20px;height:20px;stroke:var(--ember);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.new-card h3{font-size:17.5px;margin-bottom:9px}
.new-card p{color:var(--muted-foreground);font-size:14.5px}
.verbadge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  border:1px solid color-mix(in oklab,var(--ember) 34%,transparent);
  background:color-mix(in oklab,var(--ember) 12%,transparent);
  color:var(--ember-soft);font:600 12.5px/1 var(--font-mono);letter-spacing:.02em;margin-left:12px;
  vertical-align:2px}
.verbadge .pip{width:6px;height:6px;border-radius:50%;background:var(--ember);
  box-shadow:0 0 0 0 color-mix(in oklab,var(--ember) 70%,transparent);animation:pip 2.4s ease-out infinite}
@keyframes pip{
  0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--ember) 70%,transparent)}
  70%{box-shadow:0 0 0 9px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
.newlink{margin-top:22px;font-size:14px;color:var(--muted-foreground)}
.newlink a{color:var(--ember-soft);text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--ember) 40%,transparent)}
.newlink a:hover{color:var(--ember)}

/* ---------- powers ---------- */
.powers{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);overflow:hidden}
@media (max-width:760px){.powers{grid-template-columns:1fr}}
.power{background:var(--card);padding:26px 24px;transition:background .22s}
.power:hover{background:color-mix(in oklab,var(--ember) 6%,var(--card));transform:none;box-shadow:none}
.power .n{font:700 12px/1 var(--font-mono);color:color-mix(in oklab,var(--ember) 75%,transparent);
  letter-spacing:.14em}
.power h3{font-size:17px;margin:13px 0 9px}
.power p{color:var(--muted-foreground);font-size:14.5px}

.nojs{max-width:640px;margin:64px auto;padding:0 24px;text-align:center}
.nojs h1{font-size:26px;margin-bottom:14px}
.nojs p{color:var(--muted-foreground);margin-bottom:18px}
.nojs a{color:var(--ember)}
</style>
<script>document.documentElement.className+=' js'</script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="#top">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="oklch(18% .02 55)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="7,7 12,12 7,17"/><line x1="13.5" y1="17" x2="18" y2="17"/></svg></span>
      <span><span class="t1">cartel</span><span class="t2">code</span></span>
    </a>
    <nav>
      <a href="#whatsnew" data-t="navNew"></a>
      <a href="#powers" data-t="navPowers"></a>
      <a href="#features" data-t="navFeatures"></a>
      <a href="#start" data-t="navStart"></a>
      <a href="#faq" data-t="navFaq"></a>
      <a href="#builds" data-t="navReleases"></a>
      <a href="./docs.html" data-t="navDocs"></a>
    </nav>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="uk" aria-pressed="true">uk</button>
        <button type="button" data-lang="en" aria-pressed="false">en</button>

        ['Де зберігаються мої дані та ключі?','Локально, у теці даних застосунку: профілі, історія сесій, API-ключі, плагіни. Запити йдуть напряму до провайдера через локальний шлюз на 127.0.0.1.'],
        ['macOS каже, що застосунок від невідомого розробника','Збірка поки не підписана сертифікатом Apple. Права кнопка → «Відкрити». Якщо блокує — «Системні параметри» → «Конфіденційність і безпека» → «Усе одно відкрити».'],
        ['Що потрібно для доступу?','Членство в обох спільнотах YT Cartel. При першому запуску відкриється сторінка входу Telegram; після підтвердження доступ лишається на пристрої.'],
        ['Як оновлюється застосунок?','Cartel Code сам перевіряє релізи на GitHub. Файл завантажується лише з github.com, а перед запуском звіряються розмір і SHA-256.'],
        ['Навіщо кілька ключів на одного провайдера?','Ключі вставляються по одному в рядок і працюють по колу: кожен новий запит іде на наступний живий. Якщо провайдер відповів, що квота вичерпана, ключ відкладається на заданий час, а запит одразу йде далі. Коли живих не лишилось, застосунок надсилає перевірочний запит на відкладені й повертає в роботу ті, що знову відповідають — тож випадково обрана платна модель не «вбиває» весь пул.'],
        ['Що таке системний промпт і навіщо він?','Це текст, який автоматично додається перед вашим повідомленням у кожному запиті до цього провайдера — модель бачить його як постійну інструкцію. Зручно, щоб задати мову й стиль відповідей або компенсувати поведінку конкретної моделі. Застосовується до всіх моделей провайдера; порожнє поле означає, що нічого не додається.'],
        ['Чи можна надсилати моделі зображення?','Так, якщо модель має зір. Оскільки вміють це не всі, зір вмикається окремо для кожної моделі — позначкою 🖼 у редакторі провайдера. Увімкнена позначка означає, що зображення надсилатимуться разом із текстом; вимкнена — ні.'],
        ['Які моделі показувати у виборі?','Кожна модель у редакторі — перемикач: зелена показується у списку, червона прихована. Приховані не видаляються й повертаються одним кліком. Так зручно ховати платні моделі, щоб не витратити квоту випадково.'],
        ['Що таке скіл і чим він відрізняється від системного промпта?','Скіл — це тека з файлом SKILL.md: угорі YAML-frontmatter з полями name (малі латинські літери, цифри й дефіс) та description, далі сам текст інструкції. Різниця з системним промптом у тому, коли цей текст доходить до моделі. Системний промпт додається перед кожним вашим повідомленням до цього провайдера й витрачає токени завжди, навіть коли до поточної задачі він не має стосунку. Зі скілів модель постійно бачить лише імена й описи, а повний текст відкриває сама — коли задача збігається з описом. Через це description і є найважливішим рядком скіла: у ньому має бути і що скіл робить, і коли його брати, інакше він просто ніколи не спрацює. Ставляться скіли з теки, з посилання на GitHub або вставленим текстом, і діють одразу: перезапуск не потрібен, тека скілів перечитується на льоту.'],
        ['Чи працюють тут скіли з Claude Code?','Так, без переробки — формат на диску той самий: тека <імʼя>/SKILL.md, а в frontmatter обовʼязкові лише name і description. Ключі, яких застосунок не знає, наприклад allowed-tools з Claude Code, ігноруються, а не викликають помилку. Найшвидший шлях: вставити посилання на теку скіла або прямо на SKILL.md у поле «Посилання на GitHub» і натиснути «Завантажити й встановити». Приймаються тільки github.com і raw.githubusercontent.com — цей текст стає інструкцією для моделі, тож джерело має бути передбачуваним. Файл перевіряється до того, як щось запишеться на диск, тому скіл із поламаним frontmatter не лишиться встановленим наполовину: ви одразу побачите, чого саме в ньому бракує.'],
        ['Що таке MCP і навіщо воно мені?','MCP (Model Context Protocol) — спільний протокол, яким зовнішня програма показує моделі свої можливості. Підключений сервер зʼявляється в переліку інструментів як mcp__<імʼя-сервера>__<інструмент> і працює нарівні з вбудованими. Так додають те, чого в застосунку немає: доступ до конкретної робочої теки, довгу памʼять між сесіями, покрокове мислення — ці три сервери вже є в каталозі й підставляються у форму одним кліком. Типів підключення два: stdio — сервер запускається як звичайна програма на цьому ж компʼютері й спілкується через свій ввід і вивід; streamable-http — сервер уже десь працює, і ви даєте його URL та заголовки. Кнопка «Перевірити підключення» справді піднімає сервер в окремому процесі й показує реальний перелік інструментів, які отримає модель. Сервер має рівно ті права, які ви йому дали, тож серверу файлів вказуйте конкретну робочу теку, а не диск цілком. Самі сервери підхоплюються після перезапуску.'],
        ['Чи можу я зробити власний плагін, якщо не вмію програмувати?','Так, бо писати його не обовʼязково самому. На сторінці «Мої плагіни» є кнопка «Вставити інструкцію в чат»: вона кладе у поле вводу готове завдання — потрібний склад файлів, формат package.json з обовʼязковим полем dsh.bundle.patch (без нього застосунок вважатиме пакет звичайною залежністю, і плагін не завантажиться), формат cordis.patch.yml і перелік помилок, на яких агент тут найчастіше спотикається. Вам лишається дописати в кінці одне речення про те, що плагін має робити, і надіслати — далі агент пише код і встановлює його сам. Якщо хочеться спершу подивитися на приклад, кнопка «Створити заготовку» робить робочий пакет з одним інструментом і поясненнями в коментарях. Встановлення робить посилання на вашу теку, а не копію, тож будь-яка правка в коді підхоплюється звичайним перезапуском — встановлювати заново не треба. Сам плагін починає працювати після перезапуску.'],
        ['Що буде, якщо мій плагін зламається?','Плагін, який не зміг активуватися, зупиняє запуск усього застосунку: це не мʼяка помилка — програма відмовляється стартувати взагалі, і вікно просто не відкривається. Найчастіша причина — неіснуюче імʼя сервісу в inject: попередження про це немає, плагін мовчки ніколи не активується. Cartel Code розпізнає такий збій у журналі запуску, називає винний плагін і пропонує його вимкнути. Вимкнення редагує маніфест профілю напряму, тож працює навіть тоді, коли встановлення пакетів саме по собі зламане. Теку з вашим кодом при цьому не чіпають: виправили помилку, встановили ще раз — і плагін повернувся на місце.']
      ]
    },

      kNew:'What\'s new',
      hNew:'Three ways to extend the app',
      pNew:'Skills, MCP servers and plugins of your own — each gets its own settings page, and each can be handed to the agent to write.',
      whatsnew:[
        ['skill','Skills','A skill is a folder with a SKILL.md file: a name, a description and the instruction text. The model picks a skill purely from that description, so a new capability is a few paragraphs rather than code. Install one from a folder, from a GitHub link or by pasting the text; the format is identical to Claude Code, and a skill works immediately, with no restart.'],
        ['mcp','MCP servers','MCP is a shared protocol through which an outside program exposes its capabilities to a model. Connect a local program over stdio or a remote server by URL, and after a restart its tools appear to the model as mcp__<name>__<tool>. Before that, Test connection really does launch the server in a separate process and shows the actual list of tools the model will get.'],
        ['plug2','Plugins of your own','A plugin here is not an add-on — it is what the app itself is made of: tools, memory and working modes are all rows in one plugin tree. Create starter gives you a working package with a sample tool, and installing links your folder instead of copying it, so edited code is picked up by a plain restart. A plugin that fails to activate halts the whole boot, so Cartel Code names the culprit itself and offers to switch it off, leaving your code folder untouched.']
      ],
      kPower:'Highlights',
      hPower:'What you would not expect from a portable build',
      pPower:'Six things that rarely make a feature list, because they only show up once you are working.',
      powers:[
        ['A key pool that heals itself','A frozen key is never thrown away: when no live keys are left, the gateway probes the parked ones and puts back into rotation whichever ones answer normally again. The usual reason a key looks dead is the model you picked, not the key — and the probe is exactly what tells the two apart.'],
        ['A skill the agent writes for itself','The skills page has a button that drops a ready instruction into the chat, carrying the SKILL.md format and the real path to the skills folder. Add what the skill should do, send it, and the agent writes the file and puts it where it belongs — live straight away, no restart.'],
        ['Rewind the conversation along with the files','The time machine walks back through the conversation and restores not only the text but the state of your files at that point. A branch that went wrong needs no untangling — step back and say it differently.'],
        ['A plugin the agent writes for itself','A button on the custom plugins page puts an instruction into the chat with the real paths of this build, the required package layout and the mistakes agents most often make here. Describe what the plugin should do, and after a restart the new tool sits in the model next to the built-in ones.'],
        ['You can see how much context is left','The context dashboard counts tokens and shows what is filling the model window right now. When the model starts dropping details there is nothing to guess about — you can watch the room run out.'],
        ['A model list shaped to your work','Vision is switched on per model with the 🖼 toggle: not every model takes images, and sending them blind just breaks the request. The same editor hides models you never use in one click, so a paid one never lands under your finger by accident.']

      feats:[
        ['gate','API gateway with a key pool','Several keys per provider, round-robin across the live ones. Hit a quota and the key freezes while the request moves to the next. Nothing to switch by hand mid-task.'],
        ['plug','168 plugins','Vision for the agent and image handling, a context dashboard with token counts, a time machine over conversation steps. One command to install.'],
        ['lang','Ukrainian interface','Not machine translation: menus, hints, states and error messages. English stays one switch away.'],
        ['tg','Telegram access','Sign-in is confirmed by your Telegram account: we never see a password, only the confirmation. Open to members of both YT Cartel communities.'],
        ['box','Fully portable','Node and Electron live inside the folder. Nothing is written to the system or the registry; data stays in the app folder, which you can move along with your history and keys.']
      ],
      steps:[
        ['Download the build for your system','A .exe for Windows, a .dmg for macOS. The buttons above already highlighted yours.'],
        ['Install and open','Windows: run the installer and pick a path without spaces or Cyrillic. macOS: drag Cartel Code to Applications, then right-click → Open on the first launch.'],
        ['Sign in and pick a working folder','The app asks you to confirm access through Telegram. Then point it at your project folder and write the first prompt.']
      ],
      faq:[
        ['Do I need Node.js or anything else installed?','No. Portable Node.js and Electron ship inside the build. Your system versions are untouched and PATH is not modified.'],
        ['Where are my data and keys stored?','Locally, in the app data folder: profiles, session history, API keys, plugins. Requests go straight to the provider through the local gateway on 127.0.0.1.'],
        ['macOS says the app is from an unidentified developer','The build is not signed with an Apple certificate yet. Right-click → Open. If it still blocks: System Settings → Privacy & Security → Open Anyway.'],
        ['What do I need for access?','Membership in both YT Cartel communities. On first launch a Telegram sign-in page opens; once confirmed, access stays on the device.'],
        ['How does the app update?','Cartel Code checks GitHub releases itself. The file is downloaded only from github.com, and its size and SHA-256 are verified before it runs.'],
        ['Why several keys for one provider?','Keys go in one per line and rotate: every request takes the next live one. If the provider says the quota is spent, that key is parked for a set time and the request moves on immediately. When no live keys remain, the app sends a probe to the parked ones and returns whichever answer again — so a paid model picked by accident never kills the whole pool.'],
        ['What is the system prompt for?','It is text prepended to every request sent to that provider, which the model reads as a standing instruction. Handy for fixing the language and tone of answers, or compensating for a particular model. It applies to all of the provider\'s models; leave it empty to send nothing.'],
        ['Can I send images to the model?','Yes, if the model has vision. Since not all do, vision is enabled per model with the 🖼 toggle in the provider editor. On means images are sent along with the text; off means they are not.'],
        ['Which models show up in the picker?','Each model in the editor is a toggle: green appears in the picker, red is hidden. Hidden ones are not deleted and come back with one click — handy for hiding paid models so you do not burn quota by accident.'],
        ['What is a skill, and how is it different from the system prompt?','A skill is a folder with a SKILL.md file: YAML frontmatter at the top with name (lowercase letters, digits and hyphens) and description, then the instruction text itself. The difference from the system prompt is when that text reaches the model. The system prompt is prepended to every message you send to that provider and costs tokens every time, even when it has nothing to do with the task at hand. Of your skills the model only ever sees the names and descriptions, and it opens the full text itself when a task matches one. That is what makes description the most important line in a skill: it has to say both what the skill does and when to reach for it, or the skill never fires. Skills install from a folder, from a GitHub link or from pasted text, and they apply immediately: no restart, the skills folder is watched live.'],
        ['Do Claude Code skills work here?','Yes, unchanged — the on-disk format is the same: a <name>/SKILL.md folder, with only name and description required in the frontmatter. Keys the app does not know, allowed-tools from Claude Code for example, are ignored rather than rejected. The quickest path: paste a link to the skill folder, or straight to SKILL.md, into the "GitHub link" field and press "Download and install". Only github.com and raw.githubusercontent.com are accepted — this text becomes instructions for the model, so the source has to be predictable. The file is checked before anything is written to disk, so a skill with broken frontmatter never ends up half-installed: you are told immediately what it is missing.'],
        ['What is MCP and why would I want it?','MCP (Model Context Protocol) is a shared protocol through which an external program exposes its capabilities to a model. A connected server appears in the tool catalog as mcp__<server-name>__<tool> and works alongside the built-in tools. That is how you add what the app does not ship: access to one specific working folder, long-term memory across sessions, structured step-by-step reasoning — these three servers are already in the catalog and fill the form with one click. There are two kinds of connection: stdio, where the server runs as an ordinary program on this machine and talks over its own input and output; and streamable-http, where the server already runs somewhere and you supply its URL and headers. "Test connection" really does start the server in a separate process and shows the actual tool list the model will get. A server has exactly the reach you hand it, so point a filesystem server at one working folder rather than a whole drive. The servers themselves come up after a restart.'],
        ['Can I make my own plugin if I cannot program?','Yes, because you do not have to write it yourself. The "My plugins" page has an "Insert instruction into chat" button: it drops a complete task into the input box — the required set of files, the package.json layout with the mandatory dsh.bundle.patch field (without it the app treats the package as an ordinary dependency and the plugin never loads), the cordis.patch.yml format, and the list of mistakes agents most often make here. All that is left for you is to add one sentence at the end about what the plugin should do and send it; the agent writes the code and installs it. If you would rather see an example first, "Create starter" produces a working package with one tool and explanations in the comments. Installing links your folder rather than copying it, so any edit to the code is picked up by a plain restart — no reinstall needed. The plugin itself starts working after that restart.'],
        ['What happens if my plugin breaks?','A plugin that fails to activate halts the whole startup: this is not a soft error — the program refuses to boot at all and the window simply does not open. The usual cause is a service name in inject that does not exist: there is no warning for it, the plugin silently never activates. Cartel Code recognises that failure in the startup log, names the guilty plugin and offers to switch it off. Switching off edits the profile manifest directly, so it works even when package installation itself is broken. Your code folder is left untouched: fix the mistake, install once more, and the plugin is back in place.']
      ]
    }
  }

    var pw = $('#powers-grid'); pw.innerHTML = ''
    ;(t.powers || []).forEach(function (f, i) {
      var d = document.createElement('div'); d.className = 'power'
      var n = document.createElement('div'); n.className = 'n'
      n.textContent = String(i + 1).padStart(2, '0')
      var h = document.createElement('h3'); h.textContent = f[0]
      var p = document.createElement('p'); p.textContent = f[1]
      d.appendChild(n); d.appendChild(h); d.appendChild(p); pw.appendChild(d)
    })
    // faq
    var qw = $('#faq-list'); qw.innerHTML = ''
    t.faq.forEach(function (q, i) {
      var d = document.createElement('details'); d.className = 'rv'; d.style.setProperty('--i', Math.min(i, 6))
      var s = document.createElement('summary'); s.textContent = q[0]
      var p = document.createElement('p'); p.textContent = q[1]
      d.appendChild(s); d.appendChild(p); qw.appendChild(d)
    })
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang))
    })
    paintReleases()
    arm()
    typeTerminal()
  }

  // ---- motion ---------------------------------------------------------------
  // One honest switch for the whole layer. Visitors who asked their system for
  // less motion get the finished page immediately: every element is placed in
  // its resting state and no timer is ever started.
  var CALM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches

  var io = null, watchdog = false

  // Reveal everything that is currently on screen. This is both the observer-
  // independent backstop below and what a re-render calls to restore already-read
  // content, so it stays cheap: the list it walks only ever shrinks.
  function revealVisible() {
    var n = 0
    Array.prototype.forEach.call(document.querySelectorAll('.rv:not(.in)'), function (el) {
      var r = el.getBoundingClientRect()
      if (r.top < window.innerHeight * 0.94 && r.bottom > 0) { el.classList.add('in'); countUp(el); n++ }
    })
    return n
  }

  // Backstop. An earlier version of this tried to DECIDE whether the observer was
  // working — first by asking whether its callback had run (it always has: an
  // observer invokes the callback for every target the moment you observe it),
  // then by asking whether anything in the first viewport was still hidden (on a
  // short window there may be nothing there to judge by). Both were guesses about
  // a thing we can simply check directly.
  //
  // So there is no decision any more. A throttled scroll pass reveals anything on
  // screen that the observer has not already handled, plus one pass shortly after
  // the tab becomes visible. When the observer works this finds nothing and walks
  // a list that only ever shrinks; when it does not, the page still reads
  // normally. The observer stays because it gives the nicer threshold behaviour,
  // not because the page depends on it.
  function watch() {
    if (watchdog || CALM) return
    watchdog = true
    var t = null
    window.addEventListener('scroll', function () {
      if (t) return
      t = setTimeout(function () { t = null; revealVisible() }, 120)
    }, { passive: true })
    window.addEventListener('resize', revealVisible, { passive: true })
    var start = function () { setTimeout(revealVisible, 2200) }
    if (document.hidden) {
      document.addEventListener('visibilitychange', function once() {
        if (document.hidden) return
        document.removeEventListener('visibilitychange', once)
        start()
      })
    } else start()
  }

  var firstArm = true
  function arm() {
    var items = document.querySelectorAll('.rv:not(.in)')
    if (!firstArm && !CALM) {
      // A re-render (language switch). Restore what was already on screen at once.
      Array.prototype.forEach.call(items, function (el) {
        if (el.getBoundingClientRect().top < window.innerHeight) {
          var t = el.style.transition
          el.style.transition = 'none'
          el.classList.add('in')
          countUp(el)
          void el.offsetHeight
          el.style.transition = t
        }
      })
      items = document.querySelectorAll('.rv:not(.in)')
    }
    firstArm = false
    if (CALM) {
      Array.prototype.forEach.call(items, function (el) { el.classList.add('in') })
      return
    }
    if (!('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(items, function (el) { el.classList.add('in') })
      return
    }
    if (!io) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return
          e.target.classList.add('in')
          io.unobserve(e.target)
          countUp(e.target)
        })
      }, { rootMargin: '0px 0px -12% 0px', threshold: .12 })
    }
    Array.prototype.forEach.call(items, function (el) { io.observe(el) })
    watch()
  }

  // Counts a stat up to its final value. Reads the target from data-count rather
  // than from the text, so re-running after a language switch cannot compound.
  function countUp(root) {
    var els = root.matches('[data-count]') ? [root] : root.querySelectorAll('[data-count]')
    Array.prototype.forEach.call(els, function (el) {
      if (el.dataset.done) return
      el.dataset.done = '1'
      var to = parseInt(el.getAttribute('data-count'), 10)
      var sfx = el.getAttribute('data-suffix') || ''
      if (!isFinite(to)) return
      if (CALM) { el.textContent = to + sfx; return }
      var t0 = 0
      function step(ts) {
        if (!t0) t0 = ts
        var k = Math.min(1, (ts - t0) / 900)
        var eased = 1 - Math.pow(1 - k, 3)
        el.textContent = Math.round(to * eased) + sfx
        if (k < 1) requestAnimationFrame(step)
      }
      requestAnimationFrame(step)
    })
  }

  // The terminal writes itself out line by line. Each run cancels the previous
  // one, because switching language re-renders the text underneath it.
  var typeRun = 0
  function typeTerminal() {
    var lines = document.querySelectorAll('.term .ln')
    var cur = $('.term .cur')
    var run = ++typeRun
    var typed = document.querySelectorAll('.term [data-type]')
    // Keep the untyped text somewhere retrievable: render() has just written the
    // current language into these nodes.
    Array.prototype.forEach.call(typed, function (el) { el.dataset.full = el.textContent })
    if (CALM) {
      Array.prototype.forEach.call(lines, function (l) { l.classList.add('on') })
      if (cur) cur.classList.add('on')
      return
    }
    Array.prototype.forEach.call(typed, function (el) { el.textContent = '' })
    Array.prototype.forEach.call(lines, function (l, i) { if (i) l.classList.remove('on') })
    if (cur) cur.classList.remove('on')

    var idx = 0
    function line() {
      if (run !== typeRun) return
      if (idx >= typed.length) { if (cur) cur.classList.add('on'); return }
      var el = typed[idx], full = el.dataset.full || '', pos = 0
      var host = lines[idx + 1]
      if (host) host.classList.add('on')
      ;(function tick() {
        if (run !== typeRun) return
        pos += 2
        el.textContent = full.slice(0, pos)
        if (pos < full.length) return setTimeout(tick, 14)
        idx++
        setTimeout(line, 190)
      })()
    }
    setTimeout(line, 620)
  }

  // Header picks up a shadow once the hero is behind you.
  function watchHeader() {
    var head = document.querySelector('header')
    if (!head) return
    var on = false
    function upd() {
      var want = window.scrollY > 24
      if (want !== on) { on = want; head.classList.toggle('stuck', on) }
    }
    window.addEventListener('scroll', upd, { passive: true })
    upd()
  }

  // ---- OS detection. Phones/tablets get no highlight: neither build runs there,
  // and this page is shared through Telegram, so most visitors arrive on mobile.
  function detectOS() {
    var uad = navigator.userAgentData
    if (uad && uad.mobile === true) return null
    var ua = navigator.userAgent || ''
    var plat = (uad && uad.platform) || navigator.platform || ''
    if (/Android|iPhone|iPad|iPod/i.test(ua)) return null
    // Mac first: the string "Darwin" contains "win".
    if (/Mac|Darwin/i.test(plat + ' ' + ua)) {
      // iPadOS in desktop mode reports MacIntel but is the only "Mac" with touch.
      if ((navigator.maxTouchPoints || 0) > 1) return null
      return 'mac'
    }
    if (/Win/i.test(plat + ' ' + ua)) return 'win'
    return null
  }

  var REL = null, RELERR = false
  function usable(a) {
    var n = (a.name || '').toLowerCase()
    if (/\.(sha256|blockmap|yml|yaml|json)$/.test(n)) return false
    return /\.(exe|dmg|zip)$/.test(n)
  }
  function pick(os) {
    if (!REL || !REL.assets) return []
    var a = REL.assets.filter(usable)
    if (os === 'win') return a.filter(function (x) { return /\.exe$/i.test(x.name) })
    return a.filter(function (x) { return /\.dmg$/i.test(x.name) })
  }

  function paintReleases() {
    var t = T[lang], os = detectOS()
    var note = $('#hero-note')
    if (RELERR) {
      note.innerHTML = ''
      var a = document.createElement('a'); a.href = RELEASES_URL; a.target = '_blank'; a.rel = 'noopener'
      a.textContent = t.offline; a.style.color = 'var(--ember)'
      note.appendChild(a)
    } else if (!REL) {
      setText(note, t.notPublished)
    } else {
      var d = REL.published_at ? new Date(REL.published_at).toLocaleDateString(lang === 'uk' ? 'uk-UA' : 'en-GB') : ''
      setText(note, t.published.replace('{v}', (REL.tag_name || '').replace(/^v/, '')).replace('{d}', d))
    }
    // The badge next to "What's new" names the release it describes. Taking it from
    // the live API rather than from the markup means it cannot be left behind by a
    // release nobody remembered to hand-edit the page for.
    var vb = $('#new-ver')
    if (vb && REL && REL.tag_name) setText(vb, String(REL.tag_name).replace(/^v/, ''))
    ;[['win', '#row-win', '#meta-win', '#dl-win', '#yours-win'],
      ['mac', '#row-mac', '#meta-mac', '#dl-mac', '#yours-mac']].forEach(function (r) {
      var kind = r[0], row = $(r[1]), meta = $(r[2]), wrap = $(r[3]), badge = $(r[4])
      var list = pick(kind)
      row.classList.toggle('is-yours', os === kind)
      badge.hidden = os !== kind
      badge.textContent = t.yours
      wrap.innerHTML = ''
      if (!list.length) {
        setText(meta, kind === 'win' ? '.exe · ' + t.noBuild : '.dmg · ' + t.noBuild)
        var s = document.createElement('span'); s.className = 'dl dl-off'; s.textContent = t.soon
        wrap.appendChild(s)
        return
      }
      // label each size when two architectures exist, so nobody reads the wrong one
      var ext = kind === 'win' ? '.exe' : '.dmg'
      setText(meta, ext + ' · ' + list.map(function (x) {
        var arch = /arm64/i.test(x.name) ? 'Apple Silicon ' : (/x64|x86_64/i.test(x.name) && list.length > 1 ? 'Intel ' : '')
        return arch + fmtSize(x.size)
      }).join(' · '))
      list.forEach(function (x) {
        var a = document.createElement('a')
        a.className = 'dl dl-on'
        a.href = safeUrl(x.browser_download_url) || RELEASES_URL
        a.rel = 'noopener'
        var arch = list.length > 1 ? (/arm64/i.test(x.name) ? 'Apple Silicon' : 'Intel') : t.download
        a.textContent = arch
        wrap.appendChild(a)
      })
    })
  }

  function loadReleases() {
    if (typeof fetch !== 'function') { RELERR = true; return paintReleases() }
    var ctl = new AbortController()
    var timer = setTimeout(function () { ctl.abort() }, 10000)
    fetch('https://api.github.com/repos/' + REPO + '/releases/latest', {
      headers: { Accept: 'application/vnd.github+json' }, signal: ctl.signal
    }).then(function (r) {
      clearTimeout(timer)
      if (r.status === 404) { REL = null; return null }       // no release yet — not an error
      if (!r.ok) { RELERR = true; return null }
      return r.json()
    }).then(function (j) { if (j) REL = j; paintReleases() })
      .catch(function () { clearTimeout(timer); RELERR = true; paintReleases() })
  }

  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang') === 'en' ? 'en' : 'uk'
      try { localStorage.setItem('cc-lang', lang) } catch (e) {}
      render()
    })
  })
  try { var saved = localStorage.getItem('cc-lang'); if (saved === 'en' || saved === 'uk') lang = saved } catch (e) {}
  if (lang === 'uk' && !/uk|ru/i.test(navigator.language || '')) { /* keep uk as the default anyway */ }

  render()
  watchHeader()
  loadReleases()
})()
</script>
</body>
</html>
