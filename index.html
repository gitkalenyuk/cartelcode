<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartel Code — портативний агент для коду</title>
<meta name="description" content="Cartel Code — десктопний застосунок з власним шлюзом API, пулом ключів, 168 плагінами і повністю українською оболонкою." />
<meta name="color-scheme" content="dark" />
<meta property="og:title" content="Cartel Code — портативний агент для коду" />
<meta property="og:description" content="Пише, читає й править код разом з вами. Node і Electron уже всередині: розпакували — працює." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23140f0c'/%3E%3Cg fill='none' stroke='%23ff7a3d' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='7,7 12,12 7,17'/%3E%3Cline x1='13.5' y1='17' x2='18' y2='17'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --background:oklch(16% .008 60);
  --foreground:oklch(95% .01 80);
  --card:oklch(20% .009 60);
  --muted:oklch(24% .011 60);
  --muted-foreground:oklch(68% .015 70);
  --border:oklch(32% .012 60);
  --accent:oklch(26% .02 55);
  --ember:oklch(70% .19 45);
  --ember-soft:oklch(82% .14 65);
  --destructive:oklch(62% .22 25);
  --gradient-ember:linear-gradient(135deg,var(--ember-soft),var(--ember));
  --glow-ember:0 0 0 1px color-mix(in oklab,var(--ember) 35%,transparent),0 20px 60px -20px color-mix(in oklab,var(--ember) 55%,transparent);
  --radius:.75rem;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --wrap:1120px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none !important;transition:none !important}}
body{
  margin:0;background:var(--background);color:var(--foreground);
  font-family:var(--font-sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
  background:color-mix(in oklab,var(--background) 82%,transparent);
  border-bottom:1px solid color-mix(in oklab,var(--border) 60%,transparent)}
.nav{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:700}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--gradient-ember);display:grid;place-items:center;flex:none}
.brand .mark svg{width:17px;height:17px}
.brand .t1{color:var(--foreground)}
.brand .t2{color:var(--ember)}
.nav nav{display:flex;gap:6px;margin-left:14px}
.nav nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted-foreground);font-size:14.5px}
.nav nav a:hover{color:var(--foreground);background:var(--muted)}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted-foreground);font:600 12.5px/1 var(--font-sans);
  padding:7px 11px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--ember);color:oklch(18% .02 55)}
.ghlink{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--border);
  border-radius:9px;text-decoration:none;font-size:14px;color:var(--foreground)}
.ghlink:hover{border-color:color-mix(in oklab,var(--ember) 50%,var(--border))}
.ghlink svg{width:16px;height:16px;fill:currentColor}
@media (max-width:860px){.nav nav{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;padding:88px 0 56px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% 20% auto 20%;height:420px;
  background:radial-gradient(closest-side,color-mix(in oklab,var(--ember) 18%,transparent),transparent);
  filter:blur(30px);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:6px 13px;border-radius:999px;
  border:1px solid color-mix(in oklab,var(--ember) 32%,transparent);
  background:color-mix(in oklab,var(--ember) 10%,transparent);
  color:var(--ember-soft);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ember)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:48px;align-items:center}
.hero-copy{min-width:0}
/* one column below the point where a 2-up hero starts squeezing the headline */
@media (max-width:1000px){.hero-grid{grid-template-columns:1fr;gap:36px}}
.hero h1{font-size:clamp(32px,4.6vw,54px);line-height:1.07;margin:22px 0 0;max-width:14ch}
.hero h1 .em{background:var(--gradient-ember);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero .lead{color:var(--muted-foreground);font-size:clamp(15.5px,1.6vw,18px);max-width:62ch;margin-top:20px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:11px;
  font:600 15px/1 var(--font-sans);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--gradient-ember);color:oklch(18% .02 55);box-shadow:var(--glow-ember)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{border-color:var(--border);color:var(--foreground);background:transparent}
.btn-ghost:hover{background:var(--muted);border-color:color-mix(in oklab,var(--ember) 40%,var(--border))}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.note{margin-top:18px;font-size:13.5px;color:var(--muted-foreground)}

/* ---------- terminal ---------- */
.term{min-width:0;border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);
  background:oklch(13% .008 60);overflow:hidden;box-shadow:0 30px 80px -40px #000}
.term .bar{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--border);
  background:color-mix(in oklab,var(--card) 70%,transparent)}
.term .bar i{width:11px;height:11px;border-radius:50%;background:var(--border);display:block}
.term .bar i:first-child{background:oklch(62% .18 25)}
.term .bar i:nth-child(2){background:oklch(78% .15 85)}
.term .bar i:nth-child(3){background:oklch(72% .16 145)}
.term .bar span{margin-left:8px;font:500 12.5px/1 var(--font-mono);color:var(--muted-foreground)}
.term pre{margin:0;padding:20px 18px;font:14px/1.85 var(--font-mono);overflow-x:auto}
.term .p{color:var(--ember)}
.term .arrow{color:var(--muted-foreground)}
.term .ok{color:oklch(76% .15 150)}
.term .cur{display:inline-block;width:8px;height:16px;background:var(--ember);vertical-align:-3px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);overflow:hidden;margin-top:26px}
.stat{background:var(--background);padding:22px 18px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:clamp(24px,3.4vw,34px);color:var(--ember)}
.stat span{display:block;margin-top:4px;font-size:13px;color:var(--muted-foreground)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats{margin-top:44px}

/* ---------- sections ---------- */
section{padding:76px 0}
.sec-head{margin-bottom:38px}
.sec-kicker{font:600 12px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
.sec-head h2{font-size:clamp(25px,3.6vw,38px);margin-top:14px}
.sec-head p{color:var(--muted-foreground);margin-top:12px;max-width:64ch}

/* builds */
.builds{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.builds{grid-template-columns:1fr}}
.build{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);
  padding:22px;display:flex;align-items:center;gap:16px;transition:.15s}
.build.is-yours{border-color:color-mix(in oklab,var(--ember) 55%,var(--border));box-shadow:var(--glow-ember)}
.build .os{width:44px;height:44px;border-radius:12px;background:var(--muted);display:grid;place-items:center;flex:none}
.build .os svg{width:22px;height:22px;fill:var(--foreground)}
.build .meta{flex:1;min-width:0}
.build .meta b{display:block;font-family:var(--font-display);font-size:17px}
.build .meta span{display:block;font:12.5px/1.5 var(--font-mono);color:var(--muted-foreground);margin-top:3px;word-break:break-word}
.yours{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font:600 10.5px/1.6 var(--font-sans);
  text-transform:uppercase;letter-spacing:.05em;background:color-mix(in oklab,var(--ember) 18%,transparent);color:var(--ember-soft)}
.dlwrap{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.dl{padding:10px 17px;border-radius:10px;font:600 14px/1 var(--font-sans);text-decoration:none;white-space:nowrap}
.dl-on{background:var(--gradient-ember);color:oklch(18% .02 55)}
.dl-off{border:1px solid var(--border);color:var(--muted-foreground)}
.shield{margin-top:16px;display:flex;gap:11px;align-items:flex-start;padding:15px 17px;border-radius:var(--radius);
  border:1px solid var(--border);background:color-mix(in oklab,var(--card) 60%,transparent);
  font-size:13.5px;color:var(--muted-foreground)}
.joins{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.join{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;text-decoration:none;
  font:600 13px/1 var(--font-sans);border:1px solid color-mix(in oklab,var(--ember) 40%,var(--border));
  color:var(--ember-soft);background:color-mix(in oklab,var(--ember) 8%,transparent)}
.join:hover{background:color-mix(in oklab,var(--ember) 16%,transparent)}
.shield svg{width:17px;height:17px;flex:none;margin-top:2px;fill:var(--ember)}

/* features */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.feats{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.feats{grid-template-columns:1fr}}
.feat{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:24px;transition:.15s}
.feat:hover{border-color:color-mix(in oklab,var(--ember) 45%,var(--border));transform:translateY(-2px)}
.feat .ic{width:40px;height:40px;border-radius:11px;background:color-mix(in oklab,var(--ember) 14%,transparent);
  display:grid;place-items:center;margin-bottom:15px}
.feat .ic svg{width:20px;height:20px;stroke:var(--ember);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.feat h3{font-size:17.5px;margin-bottom:9px}
.feat p{color:var(--muted-foreground);font-size:14.5px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);padding:24px;position:relative}
.step .n{font:700 30px/1 var(--font-display);color:color-mix(in oklab,var(--ember) 55%,transparent);letter-spacing:-.03em}
.step h3{font-size:17px;margin:12px 0 9px}
.step p{color:var(--muted-foreground);font-size:14.5px}

/* faq */
.faq{display:flex;flex-direction:column;gap:10px}
details{border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);background:var(--card);overflow:hidden}
details[open]{border-color:color-mix(in oklab,var(--ember) 40%,var(--border))}
summary{cursor:pointer;padding:17px 20px;font-family:var(--font-display);font-weight:600;font-size:16px;
  list-style:none;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--ember);font:400 21px/1 var(--font-mono)}
details[open] summary::after{content:"−"}
details p{padding:0 20px 19px;color:var(--muted-foreground);font-size:14.5px}

/* footer */
footer{border-top:1px solid var(--border);padding:44px 0 54px;margin-top:20px}
.foot{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:space-between}
.foot .about{max-width:44ch}
.foot .about p{color:var(--muted-foreground);font-size:14px;margin-top:9px}
.foot .links{display:flex;flex-wrap:wrap;gap:20px}
.foot .links a{color:var(--muted-foreground);font-size:14px;text-decoration:none}
.foot .links a:hover{color:var(--ember)}
.sk{display:inline-block;min-width:70px;height:.85em;border-radius:5px;background:var(--muted);
  animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite;vertical-align:-1px}
@keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="#top">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="oklch(18% .02 55)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="7,7 12,12 7,17"/><line x1="13.5" y1="17" x2="18" y2="17"/></svg></span>
      <span><span class="t1">cartel</span><span class="t2">code</span></span>
    </a>
    <nav>
      <a href="#features" data-t="navFeatures"></a>
      <a href="#start" data-t="navStart"></a>
      <a href="#faq" data-t="navFaq"></a>
      <a href="#builds" data-t="navReleases"></a>
    </nav>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="uk" aria-pressed="true">uk</button>
        <button type="button" data-lang="en" aria-pressed="false">en</button>
      </div>
      <a class="ghlink" href="https://github.com/gitkalenyuk/cartelcode" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="hero-grid">
       <div class="hero-copy">
        <span class="eyebrow"><span class="dot"></span><span data-t="eyebrow"></span></span>
        <h1><span data-t="h1a"></span><br><span class="em" data-t="h1b"></span></h1>
        <p class="lead" data-t="lead"></p>
        <div class="cta">
          <a class="btn btn-primary" id="cta-dl" href="#builds"><span data-t="ctaDownload"></span></a>
          <a class="btn btn-ghost" href="https://github.com/gitkalenyuk/cartelcode" target="_blank" rel="noopener"><span data-t="ctaGithub"></span></a>
        </div>
        <p class="note" id="hero-note"><span class="sk"></span></p>
       </div>

       <div class="term">
        <div class="bar"><i></i><i></i><i></i><span>cartelcode — zsh</span></div>
        <pre><span class="p">$</span> ./cartelcode
<span class="arrow">→</span> <span data-t="t1"></span>
<span class="arrow">→</span> <span data-t="t2"></span>
<span class="arrow">→</span> <span data-t="t3"></span>
<span class="ok">✔</span> <span data-t="t4"></span> <span class="cur"></span></pre>
       </div>
      </div>

      <div class="stats">
        <div class="stat"><b>168</b><span data-t="s1"></span></div>
        <div class="stat"><b>100%</b><span data-t="s2"></span></div>
        <div class="stat"><b>0</b><span data-t="s3"></span></div>
        <div class="stat"><b>∞</b><span data-t="s4"></span></div>
      </div>
    </div>
  </section>

  <section id="builds">
    <div class="wrap">
      <div class="sec-head">
        <div class="sec-kicker" data-t="kBuilds"></div>
        <h2 data-t="hBuilds"></h2>
        <p data-t="pBuilds"></p>
      </div>
      <div class="builds">
        <div class="build" id="row-win">
          <div class="os"><svg viewBox="0 0 24 24"><path d="M3 5.5 10 4.6v6.9H3zm0 13L10 19.4v-6.8H3zM11 4.4 21 3v8.5H11zm0 15.2L21 21v-8.4H11z"/></svg></div>
          <div class="meta"><b>Windows<span class="yours" id="yours-win" hidden></span></b><span id="meta-win"><span class="sk"></span></span></div>

        </div>
        <div class="build" id="row-mac">
          <div class="os"><svg viewBox="0 0 24 24"><path d="M16.4 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.8-3.5.8s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.1c.9-1.2 1.2-2.4 1.3-2.4s-2.5-1-2.5-3.7zM14.2 5.9c.6-.8 1.1-1.9 1-3-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.6 2.9-1.4z"/></svg></div>
          <div class="meta"><b>macOS<span class="yours" id="yours-mac" hidden></span></b><span id="meta-mac"><span class="sk"></span></span></div>
          <div class="dlwrap" id="dl-mac"><span class="dl dl-off" data-t="soon"></span></div>
        </div>
      </div>
      <div class="shield">
        <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm0 10.5h7c-.5 4.1-3.1 7.9-7 9V11.5H5V6.3l7-3.1v8.3z"/></svg>
        <div><span data-t="shield"></span>
          <div class="joins">
            <a class="join" href="https://t.me/YT_cartell" target="_blank" rel="noopener" data-t="joinChannel"></a>
            <a class="join" href="https://t.me/+Ovf7rTg8ClBkOGQy" target="_blank" rel="noopener" data-t="joinChat"></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="features">
    <div class="wrap">
      <div class="sec-head">
        <div class="sec-kicker" data-t="kFeat"></div>
        <h2 data-t="hFeat"></h2>
        <p data-t="pFeat"></p>
      </div>
      <div class="feats" id="feats"></div>
    </div>
  </section>

  <section id="start">
    <div class="wrap">
      <div class="sec-head">
        <div class="sec-kicker" data-t="kStart"></div>
        <h2 data-t="hStart"></h2>
        <p data-t="pStart"></p>
      </div>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <section id="faq">
    <div class="wrap">
      <div class="sec-head">
        <div class="sec-kicker" data-t="kFaq"></div>
        <h2 data-t="hFaq"></h2>
        <p data-t="pFaq"></p>

  var lang = 'uk'

  function fmtSize(b) {

  function render() {

  // ---- OS detection. Phones/tablets get no highlight: neither build runs there,
  // and this page is shared through Telegram, so most visitors arrive on mobile.
  function detectOS() {
    var uad = navigator.userAgentData
    if (uad && uad.mobile === true) return null
    var ua = navigator.userAgent || ''
    var plat = (uad && uad.platform) || navigator.platform || ''
    if (/Android|iPhone|iPad|iPod/i.test(ua)) return null
    // Mac first: the string "Darwin" contains "win".
    if (/Mac|Darwin/i.test(plat + ' ' + ua)) {
      // iPadOS in desktop mode reports MacIntel but is the only "Mac" with touch.
      if ((navigator.maxTouchPoints || 0) > 1) return null
      return 'mac'
    }
    if (/Win/i.test(plat + ' ' + ua)) return 'win'
    return null
  }

  var REL = null, RELERR = false
  function usable(a) {
    var n = (a.name || '').toLowerCase()
    if (/\.(sha256|blockmap|yml|yaml|json)$/.test(n)) return false
    return /\.(exe|dmg|zip)$/.test(n)
  }
  function pick(os) {
    if (!REL || !REL.assets) return []
    var a = REL.assets.filter(usable)
    if (os === 'win') return a.filter(function (x) { return /\.exe$/i.test(x.name) })
    return a.filter(function (x) { return /\.dmg$/i.test(x.name) })
  }

  function paintReleases() {
    var t = T[lang], os = detectOS()
    var note = $('#hero-note')
    if (RELERR) {
      note.innerHTML = ''
      var a = document.createElement('a'); a.href = RELEASES_URL; a.target = '_blank'; a.rel = 'noopener'

      note.appendChild(a)
    } else if (!REL) {
      setText(note, t.notPublished)
    } else {
      var d = REL.published_at ? new Date(REL.published_at).toLocaleDateString(lang === 'uk' ? 'uk-UA' : 'en-GB') : ''
      setText(note, t.published.replace('{v}', (REL.tag_name || '').replace(/^v/, '')).replace('{d}', d))
    }
    ;[['win', '#row-win', '#meta-win', '#dl-win', '#yours-win'],
      ['mac', '#row-mac', '#meta-mac', '#dl-mac', '#yours-mac']].forEach(function (r) {
      var kind = r[0], row = $(r[1]), meta = $(r[2]), wrap = $(r[3]), badge = $(r[4])
      var list = pick(kind)
      row.classList.toggle('is-yours', os === kind)
      badge.hidden = os !== kind
      badge.textContent = t.yours
      wrap.innerHTML = ''
      if (!list.length) {
        setText(meta, kind === 'win' ? '.exe · ' + t.noBuild : '.dmg · ' + t.noBuild)
        var s = document.createElement('span'); s.className = 'dl dl-off'; s.textContent = t.soon
        wrap.appendChild(s)
        return
      }
      // label each size when two architectures exist, so nobody reads the wrong one
      setText(meta, list.map(function (x) {
        var arch = /arm64/i.test(x.name) ? 'Apple Silicon ' : (/x64|x86_64/i.test(x.name) && list.length > 1 ? 'Intel ' : '')
        return arch + fmtSize(x.size)
      }).join(' · '))
      list.forEach(function (x) {
        var a = document.createElement('a')
        a.className = 'dl dl-on'
        a.href = safeUrl(x.browser_download_url) || RELEASES_URL
        a.rel = 'noopener'
        var arch = list.length > 1 ? (/arm64/i.test(x.name) ? 'Apple Silicon' : 'Intel') : t.download
        a.textContent = arch
        wrap.appendChild(a)
      })
    })
  }

  function loadReleases() {
    if (typeof fetch !== 'function') { RELERR = true; return paintReleases() }
    var ctl = new AbortController()
    var timer = setTimeout(function () { ctl.abort() }, 10000)
    fetch('https://api.github.com/repos/' + REPO + '/releases/latest', {
      headers: { Accept: 'application/vnd.github+json' }, signal: ctl.signal
    }).then(function (r) {
      clearTimeout(timer)
      if (r.status === 404) { REL = null; return null }       // no release yet — not an error
      if (!r.ok) { RELERR = true; return null }
      return r.json()
    }).then(function (j) { if (j) REL = j; paintReleases() })
      .catch(function () { clearTimeout(timer); RELERR = true; paintReleases() })
  }

  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang') === 'en' ? 'en' : 'uk'
      try { localStorage.setItem('cc-lang', lang) } catch (e) {}
      render()
    })
  })
  try { var saved = localStorage.getItem('cc-lang'); if (saved === 'en' || saved === 'uk') lang = saved } catch (e) {}
  if (lang === 'uk' && !/uk|ru/i.test(navigator.language || '')) { /* keep uk as the default anyway */ }

  render()
  loadReleases()
